name: Publish the preview

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Build Neurosift Chat for GitHub Pages
        env:
          VITE_APP_NAME: neurosift-chat
          VITE_PREVIEW: "1"
          VITE_NEUROSIFT_URL: https://jguerrero-prog.github.io/neurosift/app/
        run: npx vite build --base "/${{ github.event.repository.name }}/"

      # GitHub Pages serves 404.html for unknown paths, so /chat/<id> loads the app too.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
